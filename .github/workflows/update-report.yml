name: Update CO Walk-ins Report

on:
  schedule:
    # 1:30 UTC = 7:00 AM IST, every day
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild report from latest data
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          ORO2_DB_ID: ${{ secrets.ORO2_DB_ID }}
          QUALI_DB_ID: ${{ secrets.QUALI_DB_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node automation/build.js

      - name: Commit and push if co_walkins_report.html changed
        run: |
          git config user.name "co-walkins-report-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet co_walkins_report.html; then
            echo "No data changes today — nothing to commit."
          else
            git add co_walkins_report.html
            git commit -m "Auto-refresh CO Walk-ins Report ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (likely a race with another report's push) — rebasing and retrying ($i/5)..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
