name: Update SP Rubric Report

on:
  schedule:
    # 14:30 UTC = 8:00 PM IST, every day
    - cron: '30 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild report from latest data
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          QUALI_DB_ID: ${{ secrets.QUALI_DB_ID }}
          ORO2_DB_ID: ${{ secrets.ORO2_DB_ID }}
        run: node automation/build-sp-rubric.js

      - name: Commit and push if sp_rubric_report.html changed
        run: |
          git config user.name "sp-rubric-report-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet sp_rubric_report.html; then
            echo "No data changes today — nothing to commit."
          else
            git add sp_rubric_report.html
            git commit -m "Daily refresh: SP Rubric Report ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (likely a race with another report's push) — rebasing and retrying ($i/5)..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
